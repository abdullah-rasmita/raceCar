<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Car Runner</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121826;
      --text: #e7eefc;
      --muted: #9bb0d1;
      --accent: #5eead4;
      --danger: #fb7185;
      --lane: rgba(255,255,255,.10);
      --roadEdge: rgba(255,255,255,.18);
      --shadow: rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: radial-gradient(1200px 800px at 70% 10%, #182033 0%, var(--bg) 55%); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: 0 10px 30px var(--shadow);
      border: 1px solid rgba(255,255,255,.08);
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }
    .title strong { font-size: 15px; letter-spacing: .3px; }
    .title span { font-size: 12px; color: var(--muted); }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 12px;
      color: var(--text);
      user-select: none;
    }
    .chip b { font-variant-numeric: tabular-nums; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgba(94,234,212,.12); }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .2px;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
      user-select: none;
    }
    .btn:hover { background: rgba(255,255,255,.11); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn.primary { background: rgba(94,234,212,.14); border-color: rgba(94,234,212,.24); }
    .btn.primary:hover { background: rgba(94,234,212,.18); }

    .stage {
      position: relative;
      width: min(520px, 100%);
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(#0c1220, #0a0f1a);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px var(--shadow);
      aspect-ratio: 9 / 16;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(900px 600px at 50% -20%, rgba(94,234,212,.08) 0%, transparent 55%),
                  linear-gradient(#0a1020, #070b12);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(6, 8, 12, .56);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .card {
      width: min(360px, 100%);
      border-radius: 16px;
      background: rgba(18, 24, 38, .92);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 16px;
      text-align: center;
    }
    .card h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
      letter-spacing: .3px;
    }
    .card p {
      margin: 0 0 12px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .hint {
      font-size: 12px;
      color: rgba(231,238,252,.86);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      margin: 10px 0 14px 0;
    }
    .hint kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      margin: 0 2px;
      white-space: nowrap;
    }

    .card .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Mobile touch controls */
    .touch {
      position: absolute;
      left: 0; right: 0; bottom: 10px;
      display: none;
      justify-content: center;
      gap: 12px;
      padding: 0 12px;
      pointer-events: none;
    }
    .touch button {
      pointer-events: auto;
      width: 44%;
      max-width: 240px;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--text);
      font-weight: 700;
    }
    .touch button:active { transform: translateY(1px) scale(.99); }

    @media (hover: none) and (pointer: coarse) {
      .touch { display: flex; }
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: rgba(155,176,209,.9);
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app">
      <div class="topbar">
        <div class="title">
          <strong>Mini Car Runner</strong>
          <span>Endless obstacles · Left/Right controls</span>
        </div>

        <div class="stats">
          <div class="chip"><span class="dot"></span> <span>Score</span> <b id="score">0</b></div>
          <div class="chip"><span style="width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.35)"></span> <span>Speed</span> <b id="speed">1.0</b></div>
          <button class="btn" id="pauseBtn" type="button">Pause</button>
          <button class="btn primary" id="restartBtn" type="button">Restart</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <canvas id="game" width="540" height="960"></canvas>

        <div class="touch" aria-hidden="true">
          <button id="leftBtn" type="button">◀ Left</button>
          <button id="rightBtn" type="button">Right ▶</button>
        </div>

        <div class="overlay show" id="overlay">
          <div class="card">
            <h1 id="overlayTitle">Ready?</h1>
            <p id="overlaySub">Dodge obstacles and survive as long as you can.</p>
            <div class="hint">
              Controls:
              <div style="margin-top:8px">
                <kbd>←</kbd>/<kbd>→</kbd> or <kbd>A</kbd>/<kbd>D</kbd> ·
                <kbd>Space</kbd> pause · <kbd>R</kbd> restart
              </div>
              <div style="margin-top:8px;opacity:.85">
                Tip: difficulty ramps up automatically.
              </div>
            </div>
            <div class="row">
              <button class="btn primary" id="startBtn" type="button">Start</button>
              <button class="btn" id="howBtn" type="button">How it works</button>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        Static single-file app — commit this as <code>index.html</code>.
      </div>
    </div>
  </div>

  <script>
    (() => {
      // ---------- Canvas setup ----------
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      // Fit logic: we keep internal resolution fixed, scale via CSS.
      const W = canvas.width;
      const H = canvas.height;

      // ---------- UI ----------
      const scoreEl = document.getElementById("score");
      const speedEl = document.getElementById("speed");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlaySub = document.getElementById("overlaySub");
      const startBtn = document.getElementById("startBtn");
      const howBtn = document.getElementById("howBtn");

      const leftBtn = document.getElementById("leftBtn");
      const rightBtn = document.getElementById("rightBtn");

      // ---------- Game constants ----------
      const road = {
        x: Math.floor(W * 0.18),
        y: 0,
        w: Math.floor(W * 0.64),
        h: H,
        lanes: 3
      };

      const laneW = road.w / road.lanes;

      // Player car geometry
      const car = {
        w: Math.floor(laneW * 0.62),
        h: Math.floor(laneW * 1.08),
        x: 0,
        y: Math.floor(H * 0.80),
        lane: 1, // 0..lanes-1
        color: "#5eead4"
      };

      function laneCenter(laneIdx) {
        return road.x + laneW * laneIdx + laneW / 2;
      }

      function resetCar() {
        car.lane = 1;
        car.x = Math.floor(laneCenter(car.lane) - car.w / 2);
      }

      // Obstacles
      const obstacles = [];
      const obstacleKinds = [
        { name: "barrel", w: 0.55, h: 0.55, color: "#fbbf24" },
        { name: "cone",   w: 0.45, h: 0.65, color: "#fb7185" },
        { name: "block",  w: 0.65, h: 0.40, color: "#a78bfa" },
        { name: "oil",    w: 0.75, h: 0.35, color: "#94a3b8" },
      ];

      function spawnObstacle() {
        const lane = randInt(0, road.lanes - 1);
        const kind = obstacleKinds[randInt(0, obstacleKinds.length - 1)];
        const ow = Math.floor(laneW * kind.w);
        const oh = Math.floor(laneW * kind.h);
        const ox = Math.floor(laneCenter(lane) - ow / 2);
        const oy = -oh - 10;

        // Avoid spawning directly on top of another obstacle in same lane too close
        for (const o of obstacles) {
          if (o.lane === lane && Math.abs(o.y - oy) < oh * 2.2) return;
        }

        obstacles.push({
          lane, x: ox, y: oy, w: ow, h: oh, kind: kind.name, color: kind.color
        });
      }

      // Road dashed lines
      const dashes = [];
      function initDashes() {
        dashes.length = 0;
        const dashH = 44;
        const gap = 32;
        const total = dashH + gap;
        const count = Math.ceil(H / total) + 2;

        for (let i = 0; i < count; i++) {
          dashes.push({ y: i * total });
        }
      }

      // ---------- Game state ----------
      let running = false;
      let paused = false;
      let crashed = false;

      let score = 0;
      let speed = 520; // px/s baseline obstacle movement
      let speedMul = 1.0;

      let lastT = 0;
      let spawnTimer = 0;
      let spawnEvery = 0.95; // seconds (will decrease with difficulty)

      // Input state (smooth movement lane-to-lane)
      let moveLeftHeld = false;
      let moveRightHeld = false;
      let laneMoveCooldown = 0; // seconds
      const laneMoveDelay = 0.12;

      // ---------- Helpers ----------
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

      function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function setOverlay(show, title, sub) {
        overlay.classList.toggle("show", !!show);
        if (title != null) overlayTitle.textContent = title;
        if (sub != null) overlaySub.textContent = sub;
      }

      function setUI() {
        scoreEl.textContent = Math.floor(score).toString();
        speedEl.textContent = speedMul.toFixed(1);
        pauseBtn.textContent = paused ? "Resume" : "Pause";
      }

      function resetGame() {
        obstacles.length = 0;
        score = 0;
        speedMul = 1.0;
        speed = 520;
        spawnTimer = 0;
        spawnEvery = 0.95;
        crashed = false;
        paused = false;
        laneMoveCooldown = 0;
        resetCar();
        initDashes();
        setUI();
      }

      // ---------- Rendering ----------
      function drawRoad() {
        // Road base
        roundRect(ctx, road.x, road.y, road.w, road.h, 18);
        ctx.fillStyle = "rgba(255,255,255,0.04)";
        ctx.fill();

        // Road edges
        ctx.strokeStyle = "rgba(255,255,255,0.14)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Lane separators (dashed)
        ctx.save();
        ctx.beginPath();
        ctx.rect(road.x, road.y, road.w, road.h);
        ctx.clip();

        for (let li = 1; li < road.lanes; li++) {
          const lx = road.x + li * laneW;
          ctx.fillStyle = "rgba(255,255,255,0.10)";
          for (const d of dashes) {
            ctx.fillRect(lx - 2, d.y, 4, 44);
          }
        }
        ctx.restore();

        // Subtle center glow
        ctx.fillStyle = "rgba(94,234,212,0.03)";
        ctx.fillRect(road.x + road.w * 0.25, 0, road.w * 0.5, H);
      }

      function drawCar() {
        // body
        const x = car.x, y = car.y, w = car.w, h = car.h;
        ctx.save();

        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        roundRect(ctx, x + 6, y + 10, w, h, 16);
        ctx.fill();

        // body
        ctx.fillStyle = car.color;
        roundRect(ctx, x, y, w, h, 16);
        ctx.fill();

        // windshield
        ctx.fillStyle = "rgba(8, 12, 18, 0.55)";
        roundRect(ctx, x + w*0.18, y + h*0.18, w*0.64, h*0.26, 12);
        ctx.fill();

        // hood stripe
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        roundRect(ctx, x + w*0.45, y + h*0.12, w*0.10, h*0.72, 10);
        ctx.fill();

        // headlights
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        roundRect(ctx, x + w*0.12, y + h*0.06, w*0.18, h*0.08, 8);
        ctx.fill();
        roundRect(ctx, x + w*0.70, y + h*0.06, w*0.18, h*0.08, 8);
        ctx.fill();

        // wheels
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(x - 6, y + h*0.20, 8, h*0.22);
        ctx.fillRect(x - 6, y + h*0.58, 8, h*0.22);
        ctx.fillRect(x + w - 2, y + h*0.20, 8, h*0.22);
        ctx.fillRect(x + w - 2, y + h*0.58, 8, h*0.22);

        ctx.restore();
      }

      function drawObstacle(o) {
        ctx.save();

        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.33)";
        roundRect(ctx, o.x + 5, o.y + 8, o.w, o.h, 12);
        ctx.fill();

        // body
        ctx.fillStyle = o.color;
        roundRect(ctx, o.x, o.y, o.w, o.h, 12);
        ctx.fill();

        // detail pattern
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        if (o.kind === "cone") {
          roundRect(ctx, o.x + o.w*0.18, o.y + o.h*0.35, o.w*0.64, o.h*0.10, 8);
          ctx.fill();
          roundRect(ctx, o.x + o.w*0.22, o.y + o.h*0.55, o.w*0.56, o.h*0.10, 8);
          ctx.fill();
        } else if (o.kind === "barrel") {
          roundRect(ctx, o.x + o.w*0.10, o.y + o.h*0.18, o.w*0.80, o.h*0.10, 8);
          ctx.fill();
          roundRect(ctx, o.x + o.w*0.10, o.y + o.h*0.72, o.w*0.80, o.h*0.10, 8);
          ctx.fill();
        } else if (o.kind === "oil") {
          roundRect(ctx, o.x + o.w*0.12, o.y + o.h*0.22, o.w*0.76, o.h*0.56, 999);
          ctx.fill();
        } else { // block
          roundRect(ctx, o.x + o.w*0.14, o.y + o.h*0.20, o.w*0.72, o.h*0.60, 10);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawHUD() {
        if (!running) return;

        // small in-canvas prompt
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = "rgba(255,255,255,0.12)";
        roundRect(ctx, 14, 14, 220, 34, 12);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = "rgba(231,238,252,0.9)";
        ctx.font = "600 13px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("← / → to move · Space to pause", 24, 36);
        ctx.restore();
      }

      function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      // ---------- Update loop ----------
      function step(t) {
        requestAnimationFrame(step);
        if (!running) {
          // Still render a nice idle screen
          render(0);
          lastT = t;
          return;
        }

        const dt = Math.min(0.033, (t - lastT) / 1000 || 0);
        lastT = t;

        if (paused || crashed) {
          render(0);
          return;
        }

        update(dt);
        render(dt);
      }

      function update(dt) {
        // Difficulty ramp: speed multiplier increases slowly with time
        speedMul += dt * 0.03;                // ~ +0.03 per second
        speedMul = Math.min(speedMul, 4.0);   // cap
        speed = 520 * speedMul;

        // Spawn frequency increases (lower interval)
        spawnEvery = clamp(0.95 - (speedMul - 1.0) * 0.15, 0.35, 0.95);

        // Score
        score += dt * (12 * speedMul);
        setUI();

        // Lane movement with held keys (with small cooldown so it feels snappy)
        laneMoveCooldown = Math.max(0, laneMoveCooldown - dt);
        if (laneMoveCooldown <= 0) {
          if (moveLeftHeld) tryMove(-1);
          else if (moveRightHeld) tryMove(+1);
        }

        // Smooth car x toward lane center
        const targetX = laneCenter(car.lane) - car.w / 2;
        car.x += (targetX - car.x) * (1 - Math.pow(0.001, dt)); // exponential smoothing

        // Move road dashes
        const dashSpeed = speed * 0.65;
        for (const d of dashes) d.y += dashSpeed * dt;
        const dashH = 44, gap = 32, total = dashH + gap;
        for (const d of dashes) {
          if (d.y > H) d.y -= (Math.ceil(H / total) + 2) * total;
        }

        // Spawn obstacles
        spawnTimer += dt;
        while (spawnTimer >= spawnEvery) {
          spawnTimer -= spawnEvery;
          spawnObstacle();
          // Sometimes add a second obstacle at higher speeds
          if (speedMul > 2.0 && Math.random() < 0.25) spawnObstacle();
        }

        // Move obstacles + remove offscreen
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.y += speed * dt;
          if (o.y > H + 80) obstacles.splice(i, 1);
        }

        // Collision
        for (const o of obstacles) {
          if (aabb(car.x, car.y, car.w, car.h, o.x, o.y, o.w, o.h)) {
            crash();
            break;
          }
        }
      }

      function render(dt) {
        // Clear
        ctx.clearRect(0, 0, W, H);

        // Background stars-ish
        ctx.save();
        ctx.globalAlpha = 0.35;
        for (let i = 0; i < 30; i++) {
          const x = (i * 97) % W;
          const y = ((i * 173) + (score * 2)) % H;
          ctx.fillStyle = "rgba(255,255,255,0.10)";
          ctx.fillRect(x, y, 2, 2);
        }
        ctx.restore();

        // Road
        drawRoad();

        // Obstacles
        for (const o of obstacles) drawObstacle(o);

        // Player
        drawCar();

        // HUD
        drawHUD();

        // Pause text
        if (paused) {
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "rgba(231,238,252,0.92)";
          ctx.font = "800 34px system-ui, -apple-system, Segoe UI, Roboto, Arial";
          ctx.textAlign = "center";
          ctx.fillText("PAUSED", W/2, H/2);
          ctx.font = "600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial";
          ctx.fillStyle = "rgba(231,238,252,0.75)";
          ctx.fillText("Press Space or click Resume", W/2, H/2 + 28);
          ctx.restore();
        }
      }

      // ---------- Controls ----------
      function tryMove(dir) {
        const next = clamp(car.lane + dir, 0, road.lanes - 1);
        if (next !== car.lane) {
          car.lane = next;
          laneMoveCooldown = laneMoveDelay;
        }
      }

      function onKeyDown(e) {
        if (e.repeat) return;
        const k = e.key.toLowerCase();

        if (k === "arrowleft" || k === "a") {
          moveLeftHeld = true;
          e.preventDefault();
        } else if (k === "arrowright" || k === "d") {
          moveRightHeld = true;
          e.preventDefault();
        } else if (k === " " || k === "spacebar") {
          togglePause();
          e.preventDefault();
        } else if (k === "r") {
          startOrRestart();
          e.preventDefault();
        }
      }

      function onKeyUp(e) {
        const k = e.key.toLowerCase();
        if (k === "arrowleft" || k === "a") moveLeftHeld = false;
        if (k === "arrowright" || k === "d") moveRightHeld = false;
      }

      function bindTouch(btn, setter) {
        // pointer events so it works on mobile + desktop
        btn.addEventListener("pointerdown", (e) => { setter(true); btn.setPointerCapture?.(e.pointerId); e.preventDefault(); });
        btn.addEventListener("pointerup",   (e) => { setter(false); e.preventDefault(); });
        btn.addEventListener("pointercancel", () => setter(false));
        btn.addEventListener("pointerleave",  () => setter(false));
      }

      // ---------- Game flow ----------
      function start() {
        running = true;
        paused = false;
        crashed = false;
        setOverlay(false);
        lastT = performance.now();
        setUI();
      }

      function crash() {
        crashed = true;
        running = true; // keep loop rendering
        paused = false;

        const finalScore = Math.floor(score);
        setOverlay(true, "Crashed!", `Final score: ${finalScore}. Press R or Restart to try again.`);
      }

      function togglePause() {
        if (!running) return;
        if (crashed) return;
        paused = !paused;
        setUI();
      }

      function startOrRestart() {
        resetGame();
        start();
      }

      // ---------- UI events ----------
      pauseBtn.addEventListener("click", () => {
        if (!running) return;
        if (crashed) return;
        togglePause();
      });

      restartBtn.addEventListener("click", () => startOrRestart());

      startBtn.addEventListener("click", () => startOrRestart());

      howBtn.addEventListener("click", () => {
        const msg =
          "How it works:\n\n" +
          "• You have 3 lanes.\n" +
          "• Obstacles spawn at the top and move down.\n" +
          "• Use Left/Right (or A/D) to change lanes.\n" +
          "• Score increases over time, and the game speeds up.\n\n" +
          "Tip: Keep moving early—difficulty ramps up.";
        alert(msg);
      });

      bindTouch(leftBtn,  (v) => { moveLeftHeld = v; if (v) moveRightHeld = false; });
      bindTouch(rightBtn, (v) => { moveRightHeld = v; if (v) moveLeftHeld = false; });

      window.addEventListener("keydown", onKeyDown, { passive: false });
      window.addEventListener("keyup", onKeyUp);

      // Tap/click on stage: quick-start if not running
      document.getElementById("stage").addEventListener("pointerdown", () => {
        if (!running) startOrRestart();
      });

      // Prevent page scrolling on arrow keys in some browsers
      window.addEventListener("keydown", (e) => {
        if (["ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
      }, { passive: false });

      // ---------- Init ----------
      resetGame();
      setOverlay(true, "Ready?", "Dodge obstacles and survive as long as you can.");
      requestAnimationFrame(step);

    })();
  </script>
</body>
</html>
